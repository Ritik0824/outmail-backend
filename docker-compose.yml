services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: outmail
      POSTGRES_USER: outmail
      POSTGRES_PASSWORD: outmail
    ports:
      - "5432:5432"
    volumes:
      - outmail-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U outmail -d outmail"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - outmail-redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  outmail-postgres:
  outmail-redis:
