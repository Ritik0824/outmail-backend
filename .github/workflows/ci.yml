name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: outmail
          POSTGRES_USER: outmail
          POSTGRES_PASSWORD: outmail
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U outmail -d outmail"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      NODE_ENV: test
      DATABASE_URL: postgresql://outmail:outmail@localhost:5432/outmail?schema=ci
      TEST_DATABASE_URL: postgresql://outmail:outmail@localhost:5432/outmail?schema=ci
      REDIS_URL: redis://localhost:6379
      APP_ORIGINS: http://localhost:8080
      FRONTEND_URL: http://localhost:8080
      JWT_SECRET: test-jwt-secret-with-at-least-32-characters
      SECRET_KEY: test-encryption-key-with-at-least-32-characters
      GOOGLE_CLIENT_ID: test-google-client-id
      GOOGLE_CLIENT_SECRET: test-google-client-secret
      GOOGLE_REDIRECT_URI: http://localhost:3000/api/auth/google/callback
      AWS_REGION: us-east-1
      AWS_ACCESS_KEY_ID: test-access-key
      AWS_SECRET_ACCESS_KEY: test-secret-key
      S3_BUCKET: test-bucket
      S3_URL: https://test-bucket.s3.us-east-1.amazonaws.com
      QUEUE_ADMIN_EMAILS: admin@example.com

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm audit --omit=dev
      - run: npm run check
      - run: npm test
      - run: npm run db:deploy
      - run: npm run test:integration
